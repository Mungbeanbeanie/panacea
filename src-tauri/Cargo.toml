[package]
name = "bio-digital-defense"
version = "0.1.0"
edition = "2021"

[dependencies]
anchor-client = "1.1.2"
bio_digital_defense = { version = "0.1.0", path = "../programs/bio_digital_defense", default-features = false, features = ["no-entrypoint"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
solana-commitment-config = "=3.1.1"
solana-keypair = "=3.1.2"
solana-rpc-client = "=3.1.14"
solana-signature = "=3.4.1"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.18"
wasmi = "1.1.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[build-dependencies]
tauri-build = "2.6.3"
