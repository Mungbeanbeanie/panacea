[package]
name = "bio-digital-defense"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[build-dependencies]
tauri-build = "2.6.3"
