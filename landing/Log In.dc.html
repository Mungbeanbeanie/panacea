<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Panacea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #1c1c1f; }
    body { font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c5b3e6; text-decoration: none; }
    a:hover { color: #ddd0f2; }
    input::placeholder { color: #6f6c78; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 220ms ease-out both pan-fade-out; }
    ::view-transition-new(root) { animation: 260ms ease-in both pan-fade-in; }
    @keyframes pan-fade-out { to { opacity: 0; } }
    @keyframes pan-fade-in { from { opacity: 0; } }
    @keyframes pan-page-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    x-dc > div { animation: 320ms ease-out both pan-page-enter; }
    ::selection { background: rgba(197,179,230,0.35); }
  </style>
</helmet>

<div style="min-height: 100vh; background: #1c1c1f; color: #f2f1f4; display: flex; flex-direction: column">

  <!-- NAV -->
  <nav style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 48px">
    <a href="Panacea Landing.dc.html" style="display: flex; align-items: baseline; gap: 14px; color: #f2f1f4" style-hover="color: #ffffff">
      <span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.5px">Panacea</span>
      <span style="font-size: 12px; color: #8f8c96; letter-spacing: 0.4px; text-transform: uppercase">Bio-Digital Defense</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #8f8c96">
      New to Panacea?
      <a href="Create Account.dc.html" style="font-size: 14px; font-weight: 600; color: #17240d; background: #78be43; padding: 10px 18px; border-radius: 8px" style-hover="background: #8ecf5b; color: #17240d">Create account</a>
    </div>
  </nav>

  <!-- BODY -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px 100px">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(120,190,67,0.1); border: 1px solid rgba(120,190,67,0.4); display: flex; align-items: center; justify-content: center">
          <span style="width: 12px; height: 12px; border-radius: 50%; background: #78be43; display: inline-block"></span>
        </div>
        <h1 style="font-family: 'Chakra Petch', sans-serif; font-size: 32px; font-weight: 700; margin: 0">Welcome back.</h1>
        <p style="font-size: 15px; color: #8f8c96; margin: 0">Your Scouts kept watch while you were away.</p>
      </div>

      <form style="background: #232227; border: 1px solid #2f2e34; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box" onSubmit="{{ handleSubmit }}">

        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="email" style="font-size: 13px; font-weight: 600; color: #c9c6d0">Email</label>
          <input id="email" type="email" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" style="background: #1c1c1f; border: 1px solid #3b3a40; border-radius: 10px; padding: 13px 16px; font-size: 15px; color: #f2f1f4; font-family: 'IBM Plex Sans', sans-serif; outline: none; width: 100%; box-sizing: border-box" style-focus="border-color: #c5b3e6">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <label for="password" style="font-size: 13px; font-weight: 600; color: #c9c6d0">Password</label>
            <a href="#forgot" style="font-size: 13px">Forgot password?</a>
          </div>
          <input id="password" type="password" placeholder="Your password" value="{{ password }}" onChange="{{ setPassword }}" style="background: #1c1c1f; border: 1px solid #3b3a40; border-radius: 10px; padding: 13px 16px; font-size: 15px; color: #f2f1f4; font-family: 'IBM Plex Sans', sans-serif; outline: none; width: 100%; box-sizing: border-box" style-focus="border-color: #c5b3e6">
        </div>

        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #b9b6c1; cursor: pointer">
          <input type="checkbox" checked="{{ remember }}" onChange="{{ toggleRemember }}" style="width: 16px; height: 16px; accent-color: #78be43; cursor: pointer">
          Keep me enrolled on this device
        </label>

        <sc-if value="{{ errorMsg }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 13px; color: #e08a8a; background: rgba(224,90,90,0.08); border: 1px solid rgba(224,90,90,0.35); border-radius: 10px; padding: 12px 16px">{{ errorMsg }}</div>
        </sc-if>

        <button type="submit" style="font-size: 16px; font-weight: 600; color: #17240d; background: #78be43; padding: 15px 30px; border-radius: 10px; border: none; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif" style-hover="background: #8ecf5b">Log in</button>
      </form>

      <div style="font-size: 13px; color: #8f8c96; text-align: center">Protected by Proof of Immunity — this session is validated on-chain.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '', remember: true, error: '' };

  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      remember: this.state.remember,
      errorMsg: this.state.error,
      setEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      setPassword: (e) => this.setState({ password: e.target.value, error: '' }),
      toggleRemember: (e) => this.setState({ remember: e.target.checked }),
      handleSubmit: (e) => {
        e.preventDefault();
        const { email, password } = this.state;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return this.setState({ error: 'Please enter a valid email address.' });
        if (!password) return this.setState({ error: 'Please enter your password.' });
        localStorage.setItem('panacea_signed_in', '1');
        if (!localStorage.getItem('panacea_user_name')) {
          localStorage.setItem('panacea_user_name', email.split('@')[0]);
        }
        localStorage.setItem('panacea_user_email', email.trim());
        window.location.href = 'Dashboard.dc.html';
      }
    };
  }
}
</script>
</body>
</html>
